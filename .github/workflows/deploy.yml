name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, intl
          tools: composer

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Build and smoke-test deploy artifact
        env:
          COMPOSER_MEMORY_LIMIT: -1
        run: |
          mkdir -p /tmp/phpbin
          printf '#!/bin/bash\nexec php -d memory_limit=-1 "$@"\n' > /tmp/phpbin/php
          chmod +x /tmp/phpbin/php
          export PATH=/tmp/phpbin:$PATH
          if ! bash bin/build-deploy.sh hakkachan-deploy.zip > /tmp/build.log 2>&1; then
            echo "=== build failed, last 60 lines ==="
            tail -60 /tmp/build.log
            exit 1
          fi
          tail -5 /tmp/build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 1

      - name: Upload zip to cPanel home via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          path="${FTP_PATH:-/}/hakkachan-deploy.zip"
          curl -sS --show-error --fail \
            -u "$FTP_USER:$FTP_PASSWORD" \
            -T hakkachan-deploy.zip "ftp://$FTP_HOST$path"

      - name: Run the deploy hook
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl -sS --show-error --fail \
            "https://hakkachan.my/deploy.php?token=$DEPLOY_TOKEN&zip=hakkachan-deploy.zip"
